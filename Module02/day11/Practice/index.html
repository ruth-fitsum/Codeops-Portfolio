<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habesha Market</title>
</head>
<body>
    <header>
        <h1>Habesha Market</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <section id="products">
            <h2>Our Products</h2>
            <ul>
                <li>Teff Flour</li>
                <li>Ethiopian Coffee</li>
                <li>Honey</li>
                <li>Spices</li>
            </ul>
        </section>
        <!-- difference between section and article is that  -->
        <!-- article is a self-contained unit that makes sense entirely on its own  -->
        <!-- section  is a generic grouping of related content that requires context. -->
         <article id="about">
            <h2>About Habesha Market</h2>
            <p>Habesha Market is a fictional Ethiopian marketplace selling authentic local products.</p>
        </article>
    </main> 
    <footer>
        <p>Location: Bole, Addis Ababa</p>
        <p>Contact: <a href="mailto:info@habeshamarket.et">info@habeshamarket.et</a></p>
    </footer>  
</body>
</html>
