<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 14 exercises</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1 -->
    <div class="page-layout">
        <header>
            <nav>
                <a href="#" class="logo">Logo</a>
                <div class="nav-links">
                    <a href="#">Home</a>
                    <a href="#">Products</a>
                    <a href="#">About</a>
                    <!-- button -->
                    <button type="button">Contact</button>
                </div>
            </nav>
        </header>
        <!-- 2 -->
        <main>
            <section id="flex-cards">
                <h1>Flexbox Cards</h1>
                <div class="cards">
                    <article class="card card1">
                        <h2>Card One</h2>
                    </article>
                    <article class="card card2">
                        <h2>Card Two</h2>
                    </article>
                    <article class="card card3">
                        <h2>Card Three</h2>
                    </article>
                    <article class="card card4">

                    </article>
                    <!-- 5 -->
                    <article class="card sale">
                        <span class="sale-badge">
                            ETB Sale
                        </span>
                        <img src="./images/img3.jpg" alt="Buna is on sale">

                </div>
            </section>
            </section>
            <!-- 3 -->
            <section class="grid-gallery">
                <h2>Photo Gallery</h1>
                <div class="gallery">
                    <img src="./images/img1.jpg" alt="beautiful scapeland of ethiopia">
                    <img src="./images/img2.jpg" alt="Day view of the addis ababa city">
                    <img src="./images/img3.jpg" alt="Aromatic roasted coffee beans">
                    <img src="./images/img4.jpg" alt="Traditional dish for fating season">
                    <img src="./images/img5.jpg" alt="The vibrant view of addis ababa at night">
                </div>
            </section>
        </main>
        <!-- 4 -->
        <aside class="sidebar">
            <h2>Sidebar</h2>
            <nav>
                <a href="#">Dahboard</a>
                <a href="#">Profile</a>
                <a href="#">Settings</a>

        </aside>
        <footer>
            <p>&copy; 2026 Day 14 Exercises</p>
        </footer>
